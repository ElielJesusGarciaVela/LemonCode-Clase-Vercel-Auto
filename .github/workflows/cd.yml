name: CD workflow

on:
  push:
    branches:
      - main
jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
          sudo chmod 600 ~/.ssh/id_rsa

      - name: Git config
        run: |
          git config --global user.email "git@github.com:ElielJesusGarciaVela/LemonCode-Clase-Vercel-Auto.git"
          git config --global user.name "cd-user"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run

      - name: Deploy
        run: npm run deploy -- -r git@github.com:ElielJesusGarciaVela/LemonCode-Clase-Vercel-Auto.git